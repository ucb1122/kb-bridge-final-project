<main><div id="map"></div>
<div class="sidebar">
<section class="panel"><div class="panel-head"><div class="map-reset-heading"><h1>뜨는 상권</h1><button id="reset-map" class="map-reset-text" type="button">지도 초기화</button></div>
<div class="district-fields"><label for="district">자치구<select id="district"><option value="">전체</option></select></label><label for="dong">행정동<select id="dong"><option value="">전체</option></select></label></div>
<div class="segmented"><button data-kind="dong" class="selected">뜨는 동네</button><button data-kind="area">뜨는 상권</button></div></div>
<div class="metric" aria-label="분석 지표"><button data-metric="stores" class="selected"><span class="icon" aria-hidden="true">🏬</span>점포수</button><button data-metric="sales"><span class="icon" aria-hidden="true">📈</span>매출</button><button data-metric="footfall"><span class="icon" aria-hidden="true">🚶</span>유동인구</button><button data-metric="residents"><span class="icon" aria-hidden="true">🏠</span>거주인구</button></div>
<div class="filter"><button id="filter-toggle" type="button" aria-expanded="false" aria-controls="filter-body">상세조건</button><div id="filter-body" hidden><div class="filter-reset-row"><button id="reset-conditions" class="map-reset-text" type="button">조건 초기화</button></div>

<fieldset class="filter-field"><legend>기간</legend><div class="filter-options" data-filter-group="period"><button type="button" data-filter="period" data-value="quarter">분기</button><button type="button" data-filter="period" data-value="year">년도</button></div></fieldset>
<fieldset class="filter-field" id="filter-quarter-field"><legend>기준분기 <small>분기 기준</small></legend><div id="filter-quarters" class="filter-options filter-quarters"></div></fieldset>
<fieldset class="filter-field" id="filter-year-field" hidden><legend>기준년도 <small>년도 기준</small></legend><div id="filter-years" class="filter-options filter-years"></div></fieldset>

<fieldset class="filter-field" id="filter-industry-field"><legend>업종</legend><div class="filter-options filter-industries" data-filter-group="industry">

<button type="button" data-filter="industry" data-value="CS1"><span>외식업</span><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M5 15c0 6 4 9 9 9s9-3 9-9H5Z"/><path d="M9 3c-3 3 2 4-1 8M15 3c-3 3 2 4-1 8M21 3c-3 3 2 4-1 8"/></svg></button>
<button type="button" data-filter="industry" data-value="CS2"><span>서비스업</span><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M13 11c-2-4-6-4-8-1-3 4 0 8 5 8-2 4 1 8 5 7 3-1 4-4 2-7 4 2 8 0 8-4 0-4-4-6-8-3 1-4-1-8-5-8-4 0-6 4-4 7"/></svg></button>
<button type="button" data-filter="industry" data-value="CS3"><span>소매업</span><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="4" y="5" width="20" height="18" rx="1"/><path d="M4 12h20M4 18h20M9 23v2M19 23v2"/></svg></button>
</div><p class="filter-hint" id="filter-industry-hint" hidden>업종 선택은 점포수와 매출에 적용됩니다.</p></fieldset>
</div><div class="filter-actions"><button type="button" id="filter-cancel">취소</button><button type="button" id="filter-apply">적용</button></div><select id="quarter" hidden aria-label="적용된 기준분기"></select></div></div></section>
<section class="panel rank-panel"><div class="rank-head"><b>순위 TOP 10</b><span id="rank-metric">점포수</span></div><div class="rank-meta"><strong id="rank-scope">전체</strong><small id="period">데이터 준비 중</small></div><p id="status" role="status">데이터를 확인하는 중…</p><ol id="ranking"></ol><p class="source" id="source-note">자료: KB 상권브릿지 원본 CSV</p></section>
</div>
