<!doctype html>
<html lang="ko"><head><link rel="icon" type="image/png" href="/shared/kb-favicon.png?v=4"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 상권 분석 | KB 상권브릿지</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="stylesheet" href="/pages/rising/styles.css"><link rel="stylesheet" href="/pages/rising/map-enhancements.css"><link rel="stylesheet" href="/pages/rising/kb-layout.css?v=5"><link rel="stylesheet" href="/shared/kb-nav.css"><link rel="stylesheet" href="/pages/rising/brand-theme.css?v=2"><link rel="stylesheet" href="/pages/owner/unified.css?v=12"><link rel="stylesheet" href="/shared/map-layout.css?v=4"></head><body class="owner-unified">
<header class="kb-header"><a class="brand" href="/pages/rising/" aria-label="KB 상권브릿지"><span class="kb-brand-image" aria-hidden="true"><img src="/pages/owner/assets/kb-bank-brand-source.png" alt=""></span><span>상권브릿지</span></a><nav aria-label="주 메뉴"><a href="/pages/rising/">뜨는 상권</a><a href="/pages/owner/" class="active" aria-current="page">내 상권 분석</a><a href="/pages/warning/">위험상권</a><a href="/pages/products/">금융상품 추천</a></nav><div class="header-actions"><a class="header-end" href="/pages/guide/">이용안내</a><button class="header-login" type="button" disabled title="로그인 기능 준비 중">로그인</button></div></header>
<main><div id="map"></div>
<div class="sidebar" id="analysis-controls" aria-label="내 상권 분석 조건">
<section class="panel owner-filter-panel"><div class="panel-head">
<div class="owner-title-row"><h1>내 상권 분석</h1></div>
<div class="owner-mode" role="group" aria-label="나의 상황"><button type="button" class="selected" data-owner-mode="operating" aria-pressed="true">사업 운영 중이에요</button><button type="button" data-owner-mode="preparing" aria-pressed="false">창업을 준비중이에요</button></div>

<div class="owner-find" role="group" aria-label="지역 찾는 방법"><button type="button" data-find="direct">우리 동네 직접 찾기</button><button type="button" data-find="browse" class="selected">매출·상권 둘러보기</button></div>
<div class="metric" aria-label="분석 지표"><button data-metric="stores"><span class="icon" aria-hidden="true">🏬</span>점포수</button><button data-metric="salesPerStore" class="selected"><span class="icon" aria-hidden="true">📈</span>매출</button><button data-metric="footfall"><span class="icon" aria-hidden="true">🚶</span>유동인구</button><button data-metric="residents"><span class="icon" aria-hidden="true">🏠</span>거주인구</button></div>
<details class="owner-details"><summary>상세조건</summary><div class="owner-details-body">
<div class="owner-fields"><label>분석 단위<select id="owner-kind"><option value="dong">행정동 전체</option><option value="area">공식 상권</option></select></label><label>기준 분기<select id="quarter" aria-label="기준 분기"></select></label><label>자치구<select id="district"><option value="">서울시 전체</option></select></label><label>업종<select id="owner-industry"><option value="all">전체 업종</option><option value="CS1">외식업</option><option value="CS2">서비스업</option><option value="CS3">소매업</option></select></label></div>
<select id="dong" aria-label="행정동 선택" hidden><option value="">전체</option></select>
<div class="segmented" hidden><button type="button" data-kind="dong" class="selected">행정동 전체</button><button type="button" data-kind="area">공식 상권</button></div>
<form id="owner-search-form" class="owner-search"><input id="owner-search" type="search" aria-label="동네 역 또는 확보된 주소 검색" placeholder="동네·역·확보된 주소 검색" autocomplete="off"><button type="submit" aria-label="지역 검색">⌕</button></form>
<div id="owner-search-results" class="owner-search-results" role="listbox" aria-label="지역 검색 결과" hidden></div>
<label class="owner-sales-basis" for="owner-sales-basis">매출 기준<select id="owner-sales-basis"><option value="average">점포당 월평균 (계산 참고값)</option><option value="total">분기 추정매출</option></select></label>
</div></details>
</div>
</section>
<section class="panel rank-panel"><div class="rank-head"><b id="owner-rank-title">월평균 매출 비교</b><select id="owner-rank-sort" aria-label="정렬 기준"><option value="growth">전분기 증가율순</option><option value="highest">현재 값순</option><option value="absolute">전분기 증가량순</option><option value="decline">전분기 감소율순</option></select></div><div class="rank-meta"><strong id="rank-scope">전체</strong><small id="period">데이터 준비 중</small></div><p id="status" role="status">데이터를 확인하는 중…</p><ol id="ranking"></ol><p class="source" id="source-note">자료: KB 상권브릿지 원본 CSV</p></section>
</div>
<div class="map-top"><svg class="map-pin" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5 10 21l-1.8-7.2L1 12z"/></svg><span>서울특별시</span><select id="map-district" aria-label="자치구 선택"><option value="">전체 구</option></select><select id="map-dong" aria-label="행정동 선택"><option value="">전체</option></select></div>
<aside id="region-card" class="region-card" hidden aria-label="선택 지역 분석"><div class="report-head"><div><small id="region-type">경영 진단 보고서</small><h2 id="region-title"></h2><p id="region-rank"></p></div><div class="report-actions"><a id="region-pdf" href="#" target="_blank" rel="noopener" aria-label="PDF 저장 화면 열기">PDF 저장</a><button id="region-card-close" type="button" aria-label="지역 분석 닫기">×</button></div></div><div class="report-tabs" role="tablist" aria-label="보고서 목차"><button data-report-tab="overview" class="selected" type="button" role="tab" aria-selected="true">한눈에 보기</button><button data-report-tab="industry" type="button" role="tab" aria-selected="false">업종·경쟁</button><button data-report-tab="sales" type="button" role="tab" aria-selected="false">매출</button><button data-report-tab="population" type="button" role="tab" aria-selected="false">고객·인구</button><button data-report-tab="hinterland" type="button" role="tab" aria-selected="false">주변 환경</button></div><div id="report-body" class="report-body"><section id="report-overview" class="report-page" aria-label="한눈에 보기"></section><section id="report-industry" class="report-page" aria-label="업종·경쟁" hidden></section><section id="report-sales" class="report-page" aria-label="매출" hidden></section><section id="report-population" class="report-page" aria-label="고객·인구" hidden></section><section id="report-hinterland" class="report-page" aria-label="주변 환경" hidden></section></div></aside>
<div id="map-legend" class="map-legend">원을 선택하면 해당 지역의 분석 보고서가 열립니다.</div>
</main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module" src="/pages/rising/main.js?v=22"></script></body></html>
