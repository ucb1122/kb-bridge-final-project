[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-bridge"
version = "0.1.0"
description = "상권 위험과 소상공인 경영·금융진단을 연결하는 의사결정 지원 서비스"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.57,<2",
  "python-dotenv>=1,<2",
  "reportlab>=4,<5",
]

[tool.setuptools.packages.find]
include = ["kb_bridge*"]

[tool.setuptools.package-data]
"kb_bridge.repositories" = ["schema.sql"]
